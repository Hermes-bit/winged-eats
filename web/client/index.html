<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#075C2E">
  <title>Winged Eats</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230B7A3E'/%3E%3Cpath fill='%23F5B82E' d='M6.5 24.5C8 15.5 15 8.5 25.5 6.5c.4 0 .7.4.5.8-1.2 2.6-3 4.6-5.2 6.1h3.3c.5 0 .7.5.4.9-1.5 2-3.6 3.4-6 4.1h2.6c.5 0 .7.6.3.9-3.6 2.8-8.4 4.3-14.4 5.7-.4.1-.6-.2-.5-.5z'/%3E%3C/svg%3E">
  <style>
  /* =========================================================
     Winged Eats · Design system client
     Charte Burkina Faso : vert Faso, or du Sahel, rouge, sable.
     Aucune police ni image externe (léger en 3G).
     ========================================================= */
  :root {
    --green-950: #042B17; --green-900: #063F22; --green-800: #075C2E; --green-700: #0B7A3E; --green-600: #129150;
    --green-100: #D3EADB; --green-50: #EAF5EE;
    --gold-700: #9A6A00; --gold-600: #D4960F; --gold-500: #F5B82E; --gold-100: #FCE8B2; --gold-50: #FFF7E0;
    --red-600: #D62E2E; --red-100: #F9D5D5; --red-50: #FDEDED;
    --bg: #FAF7F2; --surface: #FFFFFF; --surface-2: #F5F0E8; --ink: #1A1714; --ink-2: #4A433B; --muted: #7A7166;
    --line: #E8E0D2; --line-soft: #F0EAE0;
    --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px;
    --sh-1: 0 1px 2px rgba(26,23,20,.06), 0 1px 1px rgba(26,23,20,.04);
    --sh-2: 0 8px 20px -8px rgba(26,23,20,.22), 0 2px 4px rgba(26,23,20,.05);
    --sh-3: 0 22px 48px -16px rgba(26,23,20,.35);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --ease: cubic-bezier(.2, .8, .2, 1);
    --col: 600px;
    --dock-space: calc(92px + env(safe-area-inset-bottom));
    /* Motif tissé discret, inspiré des bandes du Faso Dan Fani */
    --weave: repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 7px),
             repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0 3px, transparent 3px 30px, rgba(255,255,255,.06) 30px 32px, transparent 32px 44px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; }
  body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
  main#app { max-width: var(--col); margin: 0 auto; min-height: 100dvh; padding-bottom: var(--dock-space); position: relative; }
  body.hide-dock main#app { padding-bottom: 120px; }
  body.bare main#app { padding-bottom: 0; }
  @media (min-width: 640px) {
    body { background: #EEE7DB; }
    main#app { background: var(--bg); box-shadow: 0 0 0 1px var(--line), var(--sh-3); }
  }
  h1, h2, h3 { font-family: var(--font-display); letter-spacing: -.02em; margin: 0; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  svg.i { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  :focus-visible { outline: 3px solid var(--gold-500); outline-offset: 2px; border-radius: 10px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .page { padding: 0 16px; }
  .muted { color: var(--muted); font-size: 14px; }

  /* ---------- Boutons ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 999px; padding: 14px 22px; font-size: 16px; font-weight: 700; background: var(--green-700); color: #fff; cursor: pointer; text-decoration: none; transition: transform .15s var(--ease), background .2s, box-shadow .2s; }
  .btn:hover { background: var(--green-800); }
  .btn:active { transform: scale(.98); }
  .btn:disabled { background: #CFC7B9; color: #fff; cursor: not-allowed; box-shadow: none; }
  .btn.block { display: flex; width: 100%; }
  .btn.lg { padding: 17px 22px; font-size: 17px; }
  .btn.dark { background: var(--ink); }
  .btn.dark:hover { background: #000; }
  .btn.ghost { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
  .btn.ghost:hover { background: var(--surface-2); }
  .btn.soft { background: var(--surface-2); color: var(--ink); }
  .btn.soft:hover { background: var(--line-soft); }
  .btn.danger-text { background: transparent; color: var(--red-600); }
  .btn.danger-text:hover { background: var(--red-50); }
  .btn.sm { padding: 9px 14px; font-size: 14px; }
  .icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; display: inline-grid; place-items: center; background: var(--surface); color: var(--ink); box-shadow: var(--sh-1), inset 0 0 0 1px var(--line-soft); cursor: pointer; position: relative; text-decoration: none; flex: none; transition: transform .15s var(--ease), background .2s; }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn.glass { background: rgba(255,255,255,.94); box-shadow: var(--sh-2); backdrop-filter: blur(8px); }
  .icon-btn .dot { position: absolute; top: 9px; right: 10px; width: 9px; height: 9px; border-radius: 50%; background: var(--gold-500); box-shadow: 0 0 0 2px #fff; }
  .icon-btn.faved { color: var(--red-600); }
  .icon-btn.faved svg.i { fill: currentColor; }
  .link-btn { background: none; border: 0; padding: 0; color: var(--green-700); font-weight: 700; cursor: pointer; font-size: 14px; }

  /* ---------- Pastilles & badges ---------- */
  .chip { display: inline-flex; align-items: center; gap: 6px; flex: none; border: 0; background: var(--surface); color: var(--ink); border-radius: 999px; padding: 9px 14px; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); white-space: nowrap; transition: background .2s, color .2s, box-shadow .2s; text-decoration: none; }
  .chip svg.i { width: 17px; height: 17px; }
  .chip.on { background: var(--green-800); color: #fff; box-shadow: none; }
  .chip.soon { color: var(--muted); }
  .chip .soon-tag { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; background: var(--gold-50); color: var(--gold-700); padding: 2px 6px; border-radius: 999px; }
  .chip .emo { font-size: 16px; line-height: 1; }
  .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 800; padding: 5px 9px; border-radius: 8px; background: #fff; color: var(--ink); line-height: 1; }
  .tag.gold { background: var(--gold-500); color: #2B1E00; }
  .tag.green { background: var(--green-700); color: #fff; }
  .tag.dark { background: rgba(20,16,12,.82); color: #fff; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
  .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .9; }
  .badge.plain::before { display: none; }
  .badge.ok { background: var(--green-50); color: var(--green-800); }
  .badge.warn { background: var(--gold-50); color: var(--gold-700); }
  .badge.bad { background: var(--red-50); color: var(--red-600); }
  .demo-chip { display: inline-block; vertical-align: middle; font-size: 10.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); padding: 3px 7px; border-radius: 6px; margin-left: 6px; position: relative; top: -2px; }

  /* ---------- Logo ---------- */
  .logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
  .logo svg { width: 36px; height: 36px; flex: none; }
  .logo b { font-family: var(--font-display); font-size: 22px; letter-spacing: -.03em; font-weight: 800; }

  /* ---------- Thèmes de vignettes (sans photo) ---------- */
  .cover { position: relative; overflow: hidden; isolation: isolate; border-radius: var(--r-lg); background: var(--green-800); color: #fff; }
  .cover::before { content: ""; position: absolute; inset: 0; background-image: var(--weave); z-index: -1; }
  .cover::after { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 90% at 70% 40%, rgba(255,255,255,.22), transparent 55%), linear-gradient(180deg, transparent 55%, rgba(0,0,0,.18)); z-index: -1; pointer-events: none; }
  .th-ember   { background: linear-gradient(140deg, #4E190A 0%, #B23F17 50%, #EE8A26 100%); }
  .th-savane  { background: linear-gradient(140deg, #04301A 0%, #0B7A3E 55%, #5FA548 100%); }
  .th-sahel   { background: linear-gradient(140deg, #7A3F05 0%, #D08A16 52%, #F6C553 100%); }
  .th-terre   { background: linear-gradient(140deg, #4F2312 0%, #A3502A 55%, #E09A5A 100%); }
  .th-bissap  { background: linear-gradient(140deg, #420A25 0%, #981C44 55%, #DF5D77 100%); }
  .tint-ember { background: #FDE9DC; } .tint-savane { background: var(--green-50); } .tint-sahel { background: var(--gold-50); }
  .tint-terre { background: #F8E8DC; } .tint-bissap { background: #FBE4EA; }
  .collage { position: absolute; inset: 0; pointer-events: none; }
  .collage span { position: absolute; line-height: 1; filter: drop-shadow(0 8px 10px rgba(0,0,0,.28)); }
  .collage .e-main { font-size: 64px; right: 14%; top: 50%; transform: translateY(-50%) rotate(-6deg); }
  .collage .e-main::before { content: ""; position: absolute; inset: -22%; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.28), rgba(255,255,255,0) 68%); z-index: -1; }
  .collage .e-1 { font-size: 26px; left: 9%; top: 16%; transform: rotate(-14deg); opacity: .95; }
  .collage .e-2 { font-size: 22px; left: 30%; bottom: 14%; transform: rotate(12deg); opacity: .9; }
  .collage .e-3 { font-size: 18px; right: 6%; top: 10%; transform: rotate(18deg); opacity: .85; }
  .cover.closed { filter: saturate(.3) brightness(.92); }

  /* ---------- En-tête d'accueil ---------- */
  .appbar { position: sticky; top: 0; z-index: 20; background: rgba(250,247,242,.9); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); padding: calc(10px + env(safe-area-inset-top)) 16px 10px; }
  .appbar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .addr { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 4px 6px 4px 0; cursor: pointer; text-align: left; min-width: 0; }
  .addr-ico { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--green-50); color: var(--green-700); flex: none; }
  .addr-ico svg.i { width: 20px; height: 20px; }
  .addr small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
  .addr b { display: flex; align-items: center; gap: 4px; font-size: 17px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .addr b svg.i { width: 18px; height: 18px; }
  .verticals { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 12px -16px 0; padding: 0 16px 2px; }
  .verticals::-webkit-scrollbar, .hscroll::-webkit-scrollbar, .cats::-webkit-scrollbar, .filters::-webkit-scrollbar, .tabs::-webkit-scrollbar, .promos::-webkit-scrollbar { display: none; }
  .verticals .chip.on { background: var(--green-50); color: var(--green-800); box-shadow: inset 0 0 0 1.5px var(--green-700); }

  /* ---------- Bandeaux promotionnels ---------- */
  .promos { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 8px 16px 4px; scroll-padding: 0 16px; }
  .promo { flex: 0 0 88%; scroll-snap-align: start; min-height: 162px; padding: 18px 20px; border-radius: 24px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 6px; }
  .promo .eyebrow { font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; opacity: .85; }
  .promo h3 { font-size: 21px; line-height: 1.15; max-width: 64%; font-weight: 800; }
  .promo p { margin: 0; font-size: 13.5px; opacity: .9; max-width: 62%; }
  .promo .btn { margin-top: 6px; background: #fff; color: var(--ink); padding: 8px 14px; font-size: 13.5px; }
  .promo .collage .e-main { font-size: 72px; right: 9%; }
  .promo .collage .e-1 { left: auto; right: 33%; top: 12%; font-size: 22px; }
  .promo .collage .e-2 { left: auto; right: 5%; bottom: 10%; font-size: 22px; }
  .promo .collage .e-3 { right: 5%; top: 10%; }
  .promo.th-sahel { color: #2B1700; }
  .promo.th-sahel .btn { background: var(--ink); color: #fff; }
  .tri { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--green-700) 0 33.3%, var(--gold-500) 33.3% 66.6%, var(--red-600) 66.6%); width: 54px; }

  /* ---------- Rail de catégories ---------- */
  .cats { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 18px 12px 4px; }
  .cat { flex: none; width: 82px; background: none; border: 0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 650; color: var(--ink-2); cursor: pointer; text-align: center; line-height: 1.2; }
  .cat-ico { width: 64px; height: 64px; border-radius: 22px; display: grid; place-items: center; font-size: 32px; transition: transform .2s var(--ease), box-shadow .2s; }
  .cat:hover .cat-ico { transform: translateY(-2px); }
  .cat.on .cat-ico { box-shadow: 0 0 0 2.5px var(--green-700), 0 8px 16px -8px rgba(11,122,62,.6); }
  .cat.on { color: var(--green-800); font-weight: 800; }

  /* ---------- Filtres ---------- */
  .filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 14px 16px 2px; }

  /* ---------- Sections ---------- */
  .sec { margin-top: 28px; }
  .sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 0 16px; margin-bottom: 12px; }
  .sec-head h2 { font-size: 22px; font-weight: 800; }
  .sec-head p { margin: 3px 0 0; font-size: 13.5px; color: var(--muted); }
  .hscroll { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; padding: 0 16px 6px; scroll-padding: 0 16px; }
  .hscroll > * { scroll-snap-align: start; }
  .results-bar { display: flex; justify-content: space-between; align-items: center; padding: 0 16px; margin: 24px 0 12px; }
  .results-bar b { font-size: 15px; }

  /* ---------- Carte restaurant ---------- */
  .rc { position: relative; flex: 0 0 272px; min-width: 0; }
  .rc .cover { aspect-ratio: 16 / 10; box-shadow: var(--sh-1); transition: transform .25s var(--ease), box-shadow .25s; }
  .rc:hover .cover { transform: translateY(-2px); box-shadow: var(--sh-2); }
  .rc .stretch { position: absolute; inset: 0; z-index: 1; border-radius: var(--r-lg); }
  .rc .stretch:focus-visible { outline-offset: 3px; }
  .rc .cover .tag { position: absolute; left: 10px; top: 10px; z-index: 2; }
  .rc .fav { position: absolute; right: 10px; top: 10px; z-index: 3; width: 36px; height: 36px; }
  .rc .fav svg.i { width: 19px; height: 19px; }
  .rc .overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(20,16,12,.3); z-index: 1; }
  .rc .overlay span { background: rgba(20,16,12,.82); color: #fff; font-weight: 800; font-size: 13.5px; padding: 8px 14px; border-radius: 999px; }
  .rc-body { padding: 10px 2px 4px; }
  .rc-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .rc-title strong { font-size: 16.5px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rc-title .dist { flex: none; font-size: 12.5px; font-weight: 700; background: var(--surface-2); color: var(--ink-2); padding: 3px 8px; border-radius: 999px; }
  .rc-sub { font-size: 13.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rc-meta { display: flex; align-items: center; gap: 12px; margin-top: 5px; font-size: 13.5px; color: var(--ink-2); }
  .rc-meta span { display: inline-flex; align-items: center; gap: 5px; }
  .rc-meta svg.i { width: 16px; height: 16px; color: var(--muted); }
  .rc-meta .fee { color: var(--green-800); font-weight: 700; }
  .rc-meta .fee svg.i { color: var(--green-700); }
  .rlist { display: grid; gap: 22px; padding: 0 16px; }
  .rlist .rc .cover { aspect-ratio: 16 / 8.5; }
  .rlist .rc .collage .e-main { font-size: 78px; }
  .rc.dim { opacity: .62; }

  /* ---------- Carte plat (carrousel) ---------- */
  .dc { position: relative; flex: 0 0 156px; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; }
  .dc .cover { aspect-ratio: 1; border-radius: 18px; }
  .dc .collage .e-main { font-size: 58px; right: 50%; transform: translate(50%, -50%) rotate(-6deg); }
  .add-fab { position: absolute; right: 8px; bottom: 8px; width: 34px; height: 34px; border-radius: 50%; background: #fff; color: var(--ink); display: grid; place-items: center; box-shadow: var(--sh-2); z-index: 2; }
  .add-fab svg.i { width: 18px; height: 18px; stroke-width: 2.6; }
  .dc small { display: block; margin-top: 8px; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dc strong { font-size: 15px; line-height: 1.25; margin-top: 1px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .dc .p { display: block; font-size: 14px; font-weight: 700; margin-top: 3px; color: var(--ink-2); }

  /* ---------- Squelettes de chargement ---------- */
  .skel { background: linear-gradient(90deg, var(--line-soft) 0%, #FBF8F3 40%, var(--line-soft) 80%); background-size: 200% 100%; animation: shimmer 1.3s infinite linear; border-radius: 12px; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* ---------- Dock de navigation flottant ---------- */
  .dock { position: fixed; z-index: 40; bottom: 0; left: 50%; transform: translateX(-50%); width: min(var(--col), 100%); padding: 22px 14px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, rgba(250,247,242,0), rgba(250,247,242,.94) 45%); pointer-events: none; }
  .dock-bar { display: flex; align-items: center; gap: 8px; pointer-events: auto; }
  .dock a { text-decoration: none; }
  .dock .icon-btn { width: 50px; height: 50px; box-shadow: var(--sh-2), inset 0 0 0 1px var(--line-soft); color: var(--ink-2); }
  .dock .icon-btn.active { background: var(--green-800); color: #fff; box-shadow: 0 10px 20px -8px rgba(7,92,46,.7); }
  .dock .search-pill { flex: 1; height: 50px; border-radius: 999px; background: var(--surface); box-shadow: var(--sh-2), inset 0 0 0 1px var(--line-soft); display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 650; font-size: 15px; color: var(--ink-2); min-width: 0; }
  .dock .search-pill svg.i { width: 20px; height: 20px; }
  .dock .search-pill.active { background: var(--green-800); color: #fff; }
  .dock .count { position: absolute; top: -4px; right: -4px; min-width: 21px; height: 21px; padding: 0 6px; border-radius: 999px; background: var(--gold-500); color: #2B1E00; font-size: 12px; font-weight: 800; display: grid; place-items: center; box-shadow: 0 0 0 2.5px var(--bg); }
  body.hide-dock .dock, body.bare .dock { display: none; }

  /* ---------- Toasts & suivi en direct ---------- */
  .toast-root { position: fixed; z-index: 90; left: 50%; transform: translateX(-50%); width: min(var(--col), 100%); bottom: var(--dock-space); padding: 0 16px; pointer-events: none; display: grid; gap: 8px; }
  body.hide-dock .toast-root, body.bare .toast-root { bottom: 104px; }
  .toast { pointer-events: auto; background: var(--ink); color: #fff; border-radius: 16px; padding: 13px 16px; font-size: 14.5px; font-weight: 600; box-shadow: var(--sh-3); display: flex; align-items: center; gap: 10px; animation: toast-in .35s var(--ease); }
  .toast svg.i { color: var(--gold-500); width: 20px; height: 20px; }
  .toast.out { animation: toast-out .25s ease forwards; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(12px) scale(.98); } }
  @keyframes toast-out { to { opacity: 0; transform: translateY(8px); } }
  .live { position: fixed; z-index: 35; left: 50%; transform: translateX(-50%); width: min(var(--col), 100%); bottom: calc(var(--dock-space) - 8px); padding: 0 16px; animation: toast-in .4s var(--ease); }
  .live a { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: 18px; padding: 10px 12px 10px 10px; text-decoration: none; box-shadow: var(--sh-3), inset 0 0 0 1px var(--line-soft); }
  .live .pulse { width: 42px; height: 42px; border-radius: 14px; background: var(--green-50); display: grid; place-items: center; font-size: 22px; position: relative; flex: none; }
  .live .pulse::after { content: ""; position: absolute; top: -3px; right: -3px; width: 11px; height: 11px; border-radius: 50%; background: var(--green-600); box-shadow: 0 0 0 2.5px #fff; animation: ping 1.6s infinite; }
  @keyframes ping { 50% { box-shadow: 0 0 0 2.5px #fff, 0 0 0 7px rgba(18,145,80,.25); } }

  /* ---------- Feuilles du bas ---------- */

  /* Options radio / case à cocher */

  .onb-sheet { background: var(--surface); border-radius: var(--r-xl) var(--r-xl) 0 0; margin-top: -28px; padding: 26px 20px calc(24px + env(safe-area-inset-bottom)); position: relative; }

  .timeline li b { display: block; font-size: 15.5px; padding-top: 3px; }
  .timeline li.done, .timeline li.cur { color: var(--ink); }
  .timeline li small { font-size: 13px; color: var(--muted); }
  .pin-card { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .pin-card .lbl b { display: block; font-size: 16px; }
  .pin-card .lbl small { color: var(--muted); font-size: 13px; }
  .pin { display: flex; gap: 6px; }
  .pin span { width: 40px; height: 50px; border-radius: 12px; display: grid; place-items: center; font-size: 24px; font-weight: 800; background: var(--green-50); color: var(--green-800); box-shadow: inset 0 0 0 1.5px var(--green-100); font-variant-numeric: tabular-nums; }

  /* ---------- Liste des commandes ---------- */
  .seg { display: flex; margin: 10px 16px 0; box-shadow: 0 1px 0 var(--line); }
  .seg button { flex: 1; background: none; border: 0; padding: 12px 0 13px; font-weight: 700; color: var(--muted); cursor: pointer; position: relative; font-size: 15px; }
  .seg button.on { color: var(--ink); }
  .seg button.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--green-700); }
  .order-row { display: flex; align-items: center; gap: 12px; text-decoration: none; padding: 14px 0; border-bottom: 1px solid var(--line-soft); }
  .order-row:last-child { border-bottom: 0; }
  .order-row .mini { width: 56px; height: 56px; border-radius: 16px; flex: none; }
  .order-row .mini .collage .e-main { font-size: 28px; right: 50%; transform: translate(50%, -50%); }
  .order-row .grow { flex: 1; min-width: 0; }
  .order-row b { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .order-row small { display: block; color: var(--muted); font-size: 13px; margin: 2px 0 6px; }
  .order-row > svg.i { color: var(--muted); }

  /* ---------- Recherche ---------- */
  .searchbar { display: flex; align-items: center; gap: 10px; flex: 1; background: var(--surface); border-radius: 999px; padding: 0 6px 0 16px; box-shadow: var(--sh-1), inset 0 0 0 1px var(--line); min-width: 0; }
  .searchbar svg.i { color: var(--muted); width: 20px; height: 20px; }
  .searchbar input { background: none; box-shadow: none; padding: 13px 0; border-radius: 0; }
  .searchbar input:focus { box-shadow: none; background: none; }
  .searchbar:focus-within { box-shadow: var(--sh-1), inset 0 0 0 2px var(--green-700); }
  .searchbar .clear { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--surface-2); display: grid; place-items: center; cursor: pointer; flex: none; }
  .searchbar .clear svg.i { width: 16px; height: 16px; }
  .recent { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 16px 0; }
  .recent .chip svg.i { color: var(--muted); }
  .list-head { font-size: 12.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 22px 16px 4px; }
  .row-link { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: none; border: 0; padding: 10px 16px; cursor: pointer; text-decoration: none; transition: background .15s; }
  .row-link:hover { background: var(--surface-2); }
  .row-link .ri { width: 48px; height: 48px; border-radius: 15px; display: grid; place-items: center; font-size: 24px; flex: none; position: relative; }
  .row-link .ri.cov .collage .e-main { font-size: 26px; right: 50%; transform: translate(50%, -50%); }
  .row-link .grow { flex: 1; min-width: 0; }
  .row-link b { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 650; }
  .row-link small { display: block; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-link .price { font-weight: 700; font-size: 14.5px; white-space: nowrap; }
  .row-link > svg.i { color: var(--muted); width: 18px; height: 18px; }
  mark { background: var(--gold-100); color: inherit; border-radius: 3px; padding: 0 1px; }

  /* ---------- Carte (plan schématique) ---------- */
  .map-wrap { position: relative; height: min(60dvh, 540px); overflow: hidden; background: #EEE7D9; }
  .map-wrap svg.plan { position: absolute; inset: 0; width: 100%; height: 100%; }
  .map-top { position: absolute; z-index: 5; top: 0; left: 0; right: 0; padding: calc(12px + env(safe-area-inset-top)) 16px 0; display: flex; gap: 10px; align-items: center; }
  .map-top .label { flex: 1; display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.96); border-radius: 999px; padding: 11px 16px; box-shadow: var(--sh-2); font-weight: 650; font-size: 15px; min-width: 0; }
  .map-top .label span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .map-top .label svg.i { color: var(--green-700); width: 20px; height: 20px; }
  .map-note { position: absolute; z-index: 3; left: 12px; bottom: 36px; font-size: 11.5px; font-weight: 700; color: var(--ink-2); background: rgba(255,255,255,.88); padding: 5px 9px; border-radius: 8px; }
  .mpin { position: absolute; z-index: 2; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; background: none; border: 0; padding: 0; cursor: pointer; transition: transform .2s var(--ease); }
  .mpin .bub { display: flex; align-items: center; gap: 6px; background: #fff; border-radius: 999px; padding: 4px; box-shadow: var(--sh-2); font-weight: 800; font-size: 12.5px; white-space: nowrap; transition: padding .2s; }
  .mpin .nm { display: none; }
  .mpin.on .bub { padding-right: 11px; }
  .mpin.on .nm { display: inline; }
  .mpin .bub .e { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; }
  .mpin::after { content: ""; width: 10px; height: 10px; background: #fff; transform: rotate(45deg); margin-top: -6px; box-shadow: 3px 3px 4px rgba(0,0,0,.08); }
  .mpin.on { z-index: 4; transform: translate(-50%, -100%) scale(1.08); }
  .mpin.on .bub { background: var(--green-800); color: #fff; }
  .mpin.on::after { background: var(--green-800); }
  .mpin.off .bub { opacity: .75; }
  .me { position: absolute; z-index: 2; width: 20px; height: 20px; transform: translate(-50%, -50%); border-radius: 50%; background: #1E6FD9; box-shadow: 0 0 0 4px #fff, 0 0 0 14px rgba(30,111,217,.16), var(--sh-2); }
  .map-sheet { position: relative; z-index: 4; background: var(--bg); border-radius: 26px 26px 0 0; margin-top: -26px; padding-top: 10px; }
  .map-sheet .rc.on .cover { box-shadow: 0 0 0 3px var(--green-700), var(--sh-2); }

  /* ---------- Compte ---------- */
  .acct-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: calc(22px + env(safe-area-inset-top)) 16px 6px; }
  .acct-head h1 { font-size: 30px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
  .acct-head small { color: var(--muted); font-size: 14px; display: block; margin-top: 4px; }
  .avatar { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; font-weight: 800; background: var(--green-800); color: #fff; flex: none; box-shadow: 0 0 0 4px var(--green-50); }
  .quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 16px 16px 0; }
  .quick a, .quick button { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px; border-radius: 18px; background: var(--surface); box-shadow: var(--sh-1), inset 0 0 0 1px var(--line-soft); text-decoration: none; border: 0; cursor: pointer; font-weight: 700; font-size: 14px; text-align: left; }
  .quick svg.i { color: var(--green-700); }
  .menu-list .row-link .ri { width: 40px; height: 40px; border-radius: 12px; background: var(--surface-2); color: var(--ink-2); }
  .menu-list .row-link .ri svg.i { width: 20px; height: 20px; }
  .foot-note { text-align: center; color: var(--muted); font-size: 12.5px; padding: 28px 16px 0; }
  .foot-note .tri { margin: 0 auto 10px; }

  /* ---------- Établissements réels (Google Places, en direct) ---------- */
  .cover img.gphoto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
  .cover .credit { position: absolute; right: 8px; bottom: 7px; z-index: 2; max-width: 70%; font-size: 10.5px; font-weight: 600; color: #fff; background: rgba(0,0,0,.48); padding: 2px 7px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0; }
  .cover .credit a { color: #fff; }
  .rc .cover .tag svg.i { width: 13px; height: 13px; fill: var(--gold-500); stroke: var(--gold-600); }
  .rc .cover .tag small { font-weight: 600; opacity: .65; }
  .rc-meta .open-now { color: var(--green-800); font-weight: 700; }
  .rc-meta .closed-now { color: var(--red-600); font-weight: 700; }
  .soon-pill { font-size: 12px; font-weight: 800; color: var(--gold-700); background: var(--gold-50); padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .gattr { font-size: 12px; color: var(--muted); padding: 10px 16px 0; margin: 0; }
  .gattr b { color: var(--ink-2); }
  .row-link .ri.cov { overflow: hidden; }
  .gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; height: 270px; }
  .gallery::-webkit-scrollbar { display: none; }
  .gallery figure { flex: 0 0 100%; margin: 0; border-radius: 0; scroll-snap-align: start; height: 100%; }
  .gallery figure .collage .e-main { font-size: 96px; right: 50%; transform: translate(50%, -50%); }
  .gallery .credit { bottom: 36px; }
  .count-pill { position: absolute; left: 12px; bottom: 36px; z-index: 2; font-size: 11.5px; font-weight: 800; color: #fff; background: rgba(0,0,0,.48); padding: 3px 8px; border-radius: 999px; }
  .store-bar .spacer { width: 44px; flex: none; }
  .soon-card { display: flex; gap: 12px; align-items: flex-start; margin-top: 16px; padding: 14px; border-radius: 18px; background: var(--gold-50); box-shadow: inset 0 0 0 1.5px var(--gold-100); }
  .soon-card .soon-ico { font-size: 26px; line-height: 1; }
  .soon-card b { display: block; font-size: 16px; }
  .soon-card p { margin: 4px 0 0; font-size: 14px; color: #6B4A00; }
  .place-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 14px; }
  .hours { list-style: none; margin: 0; padding: 0; }
  .hours li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); font-size: 14.5px; }
  .hours li:last-child { border-bottom: 0; }
  .hours li b { font-weight: 600; text-align: right; }
  .gmap { position: absolute; inset: 0; }
  .mpin.gpin { position: relative; transform: none; }
  .mpin.gpin.on { transform: scale(1.08); }
  .mpin.is-partner .bub { box-shadow: 0 0 0 2px var(--green-700), var(--sh-2); }
  .me.static { position: relative; transform: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }
  </style>
</head>
