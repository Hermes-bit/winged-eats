<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D74331">
<meta name="description" content="Commandez vos plats préférés de Ouaga et de Bobo, livrés à moto.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Winged Eats">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Winged Eats</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23F6B21B'/%3E%3Cpath d='M10 38c8-15 24-25 44-26-7 4-12 8-15 12 7-3 13-3 18-2-8 4-14 8-17 13 5-1 10 0 13 3-12 5-27 8-36 6-4-1-7-3-7-6z' fill='%23E0362A'/%3E%3Ccircle cx='17' cy='45' r='3.2' fill='%232A1712'/%3E%3C/svg%3E">
<style>
/* Winged Eats · application client : rouge Faso, encre latérite et or. */
:root{--red:#D74331;--red2:#A93628;--gold:#E8B654;--ink:#30231D;--ink2:#30231D;--mute:#786A60;--chip:#F4F0E9;--line:#F0EAE2;--line2:#E5DBCF;--sand:#F4EFE6;--soft:#F8F4ED;--green:#1E7544;--nav:70px}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--sand);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
#app{max-width:480px;margin:0 auto;min-height:100dvh;background:#fff;position:relative;padding-bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom));overflow-x:clip}
body.nonav #app{padding-bottom:100px}
body.bare #app{padding-bottom:0}
@media(min-width:520px){#app{box-shadow:0 0 0 1px var(--line2),0 24px 60px -30px #2a171266}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:10px}

/* ---------- Éléments de la maquette ---------- */
.pad{padding:0 16px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fl{display:flex;align-items:center;gap:8px}
.sp{justify-content:space-between}
.m{color:#715e55;font-size:12px;line-height:1.45}
.t{font-weight:700;font-size:14px}
.h{font-weight:750;font-size:20px;line-height:1.15;letter-spacing:-.025em;margin:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar,.hs::-webkit-scrollbar,.cats::-webkit-scrollbar,.gal::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:99px;background:var(--chip);min-height:38px;padding:8px 14px;font-weight:600;font-size:12px;display:flex;gap:5px;align-items:center;white-space:nowrap;cursor:pointer;color:var(--ink)}
.chip .ic{width:15px;height:15px}
.chip.on{background:var(--ink);color:#fff}
.chip .soon{font-size:10px;font-weight:800;color:var(--red2);text-transform:uppercase;letter-spacing:.03em}
.ft{border-radius:18px;overflow:hidden;position:relative;display:grid;place-items:center;flex:none}
.ft>svg{width:78%;height:92%}
.ft img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ft .credit{position:absolute;right:6px;bottom:5px;z-index:2;font-size:9.5px;font-weight:600;color:#fff;background:#0007;padding:1px 6px;border-radius:5px;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-riz{background:linear-gradient(150deg,#FFE7C9,#FFC48A)}.k-bro{background:linear-gradient(150deg,#FFE0D3,#F7A487)}.k-pou{background:linear-gradient(150deg,#FFF1C4,#FFD263)}.k-to{background:linear-gradient(150deg,#EAF4DA,#C3DF9C)}.k-piz{background:linear-gradient(150deg,#FFE3D9,#FFB49B)}.k-bur{background:linear-gradient(150deg,#FDEBCF,#F7C77E)}.k-bis{background:linear-gradient(150deg,#FADCE6,#EDA3BB)}.k-poi{background:linear-gradient(150deg,#DCEFF4,#A9D4E2)}
.tag{position:absolute;left:8px;top:8px;z-index:2;background:var(--red);color:#fff;font-weight:700;font-size:11px;padding:3px 7px;border-radius:6px;white-space:nowrap}
.tag.g{background:var(--gold);color:var(--ink2)}
.tag.d{background:var(--ink);color:#fff}
.heart{position:absolute;right:8px;top:8px;z-index:3;width:28px;height:28px;border-radius:50%;background:#ffffffd9;display:grid;place-items:center;border:0;cursor:pointer;color:var(--ink)}
.heart .ic{width:15px;height:15px}
.heart.on{color:var(--red)}.heart.on .ic{fill:currentColor}
.star{fill:var(--gold);stroke:none;width:12px;height:12px;vertical-align:-1px}
.nb{position:fixed;left:50%;transform:translateX(-50%);width:min(480px,100%);bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));background:rgba(255,251,247,.96);border-top:1px solid #ffffff;box-shadow:0 -8px 28px #2a17120d;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(14px + env(safe-area-inset-bottom));z-index:40}
.nb a{display:grid;justify-items:center;gap:2px;font-size:11px;color:#75645b;font-weight:600;position:relative}
.nb a.on{color:var(--red)}
.nb .badge{position:absolute;top:-4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;border:2px solid #fff}
body.nonav .nb,body.bare .nb{display:none}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;min-height:50px;border-radius:16px;background:var(--red2);color:#fff;font-weight:700;font-size:15px;border:0;width:100%;font-family:inherit;cursor:pointer;padding:10px 16px;text-align:center}
.btn.dk{background:var(--ink)}.btn.lt{background:var(--chip);color:var(--ink)}
.btn:disabled{background:#D9CCC1;color:#fff;cursor:not-allowed}
.btn.sm{min-height:38px;height:38px;font-size:13px;border-radius:11px;width:auto}
.sec{display:flex;justify-content:space-between;align-items:center;padding:24px 16px 12px;gap:10px}
.sec .m{display:block;margin-top:2px}
.arr{width:28px;height:28px;border-radius:50%;background:var(--chip);display:grid;place-items:center;border:0;cursor:pointer;flex:none}
.arr .ic{width:15px;height:15px}
.hs{display:grid;grid-auto-flow:column;grid-auto-columns:62%;gap:10px;padding:0 16px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none}
.hs>*{scroll-snap-align:start}
.rc{position:relative;display:block}
.rc .ft{height:132px}
.rc .t{margin-top:9px}
.rc .stretch{position:absolute;inset:0;z-index:1;border-radius:14px}
.rc.dim{opacity:.6}
.vlist{display:grid;gap:22px;padding:0 16px}
.vlist .rc .ft{height:165px}
.cats{display:flex;gap:12px;padding:18px 16px 8px;overflow-x:auto;scrollbar-width:none}
.cat{flex:0 0 68px;display:grid;justify-items:center;gap:6px;font-size:12px;font-weight:600;text-align:center;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.cat .ft{width:60px;height:60px;border-radius:22px;transition:box-shadow .2s}
.cat.on .ft{box-shadow:0 0 0 2.5px var(--red)}
.cat.on{color:var(--red)}
.list>*{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:14px;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer}
.list .m{font-weight:400}
.list .ic{color:#5A463E}
.list .grow{flex:1}
.om{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;font:800 11px Inter,sans-serif;flex:none}
.om.o{background:#FF7900}.om.mv{background:#0054A6}.om.cash{background:var(--green)}
.om:has(img){background:none;overflow:hidden}.om img{width:100%;height:100%;object-fit:cover;display:block}
.pm{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line2);border-radius:14px;padding:11px 12px;width:100%;background:#fff;font:inherit;text-align:left;cursor:pointer;color:inherit}
.pm.on{border-color:var(--red);background:#FFF4F2}
.rd{width:20px;height:20px;border-radius:50%;border:2px solid #CDBDB2;margin-left:auto;flex:none}
.pm.on .rd,.opt input:checked~.rd{border:6px solid var(--red)}
.tip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tip button{height:38px;border-radius:10px;border:1.5px solid var(--line2);background:#fff;font:600 12px Inter,sans-serif;cursor:pointer;color:var(--ink)}
.tip button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.q{display:flex;align-items:center;gap:6px;background:var(--chip);border-radius:99px;padding:3px;flex:none}
.q button{width:28px;height:28px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.q button .ic{width:16px;height:16px}
.q button:disabled{opacity:.4}
.q b{min-width:16px;text-align:center}
.q.lg button{width:36px;height:36px}
.lr{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:12px;padding:4px;gap:4px}
.seg button{height:34px;border:0;border-radius:9px;background:none;font:700 12px Inter,sans-serif;cursor:pointer;color:#6A574E}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px #2a171222}
.plan{border:1.5px solid var(--line2);border-radius:16px;padding:10px 12px;margin-top:10px;position:relative}
.plan.best{border-color:var(--red);background:#FFF6F3}
.plan .pr{font:800 20px Inter,sans-serif;letter-spacing:-.02em;white-space:nowrap}
.plan .pr small{font-size:12px;color:var(--mute);font-weight:600}
.plan ul{margin:6px 0 0;padding:0;list-style:none;font-size:12px;color:#5A463E}
.plan li{display:flex;gap:6px;align-items:center;padding:1px 0}
.plan li .ic{width:14px;height:14px;color:var(--green);stroke-width:2.6}
.ribbon{position:absolute;right:12px;top:-10px;background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px}
.save{color:var(--green);font-weight:700;font-size:12px}
.tg{width:48px;height:28px;border-radius:99px;background:#CDBDB2;position:relative;border:0;cursor:pointer;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.tg.on{background:var(--green)}.tg.on::after{left:23px}
.grab{width:40px;height:5px;border-radius:9px;background:#E3D6CB;margin:0 auto 10px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:10px 0}
.steps i{height:5px;border-radius:9px;background:#EFE4DA}
.steps i.on{background:var(--red)}
.av{width:44px;height:44px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-weight:800;color:var(--ink2);flex:none}
.circ{width:40px;height:40px;border-radius:50%;background:var(--chip);display:grid;place-items:center;flex:none;border:0;cursor:pointer;color:var(--ink);position:relative}
.circ.w{background:#fff;box-shadow:0 2px 8px #2a171222}
.circ.on{color:var(--red)}.circ.on .ic{fill:currentColor}
.circ .dot{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid var(--chip)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp>div{background:var(--soft);border-radius:12px;padding:9px 10px}
.kp b{display:block;font-size:16px;white-space:nowrap}
.otp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.otp span{height:52px;border-radius:12px;border:1.5px solid var(--line2);display:grid;place-items:center;font:800 22px Inter,sans-serif}
.otp span.f{border-color:var(--red)}
.unb{font-family:Unbounded,Inter,sans-serif}
@media(prefers-reduced-motion:no-preference){.pulse{animation:p 1.6s ease-in-out infinite}@keyframes p{50%{transform:scale(1.25);opacity:.55}}}

/* ---------- Écrans de l'application ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 8px;position:sticky;top:0;z-index:20;background:rgba(255,251,247,.96)}
.topbar .title{font-weight:700;font-size:15px;flex:1;text-align:center}
.bigt{font:800 26px Inter,sans-serif;letter-spacing:-.02em;margin:4px 16px 10px}
.addr{display:block;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.addr .t{display:flex;align-items:center;gap:3px}
.addr .t .ic{width:16px;height:16px}
.home-heading{margin:22px 0 14px}
.home-heading h1{max-width:320px;margin:0;font-size:clamp(25px,7vw,32px);line-height:1.08;letter-spacing:-.035em;font-weight:800}
.home-heading p{margin:7px 0 0;color:#715e55;font-size:13px}
.home-search{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 16px;border:1px solid #ecdfd5;border-radius:16px;background:#f8f2ed;color:#5a463e;font-weight:600}
.home-search .ic{color:var(--red2)}
.banner{background:var(--ink);color:#fff;border-radius:22px;padding:18px;display:flex;gap:10px;align-items:center;position:relative;overflow:hidden}
.banner .bt{font-size:18px;font-weight:750;line-height:1.15;letter-spacing:-.02em}
.banner .bs{font-size:12px;line-height:1.5;color:#f4e9e1;margin:7px 0 12px}
.banner .chip{background:var(--gold);color:var(--ink);display:inline-flex}
.mini{display:grid;grid-auto-flow:column;grid-auto-columns:31%;gap:10px;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.mini button{background:none;border:0;padding:0;text-align:left;cursor:pointer;position:relative}
.mini .n{font-weight:700;font-size:12px;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini .p{color:var(--red);font-weight:800;font-size:12px}
.mini .plus,.mrow .plus{position:absolute;right:-4px;bottom:-4px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 6px #2a171233;display:grid;place-items:center;z-index:2}
.mini .plus{right:4px;bottom:auto;top:36px}
.mini .plus .ic,.mrow .plus .ic{width:16px;height:16px}
.live{position:fixed;z-index:35;left:50%;transform:translateX(-50%);width:min(480px,100%);bottom:calc(var(--nav) + 8px + env(safe-area-inset-bottom));padding:0 12px}
.live a{display:flex;align-items:center;gap:10px;background:var(--red);color:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 10px 24px -10px #b8231acc}
.live .grow{flex:1}
.live .m{color:#FFE2DA}
.toasts{position:fixed;z-index:90;left:50%;transform:translateX(-50%);width:min(480px,100%);bottom:calc(var(--nav) + 12px + env(safe-area-inset-bottom));padding:0 16px;display:grid;gap:8px;pointer-events:none}
body.nonav .toasts,body.bare .toasts{bottom:96px}
.toast{background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;font-weight:600;display:flex;gap:10px;align-items:center;box-shadow:0 18px 40px -18px #2a1712aa;animation:tin .3s ease}
.toast .ic{color:var(--gold)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.alert{display:flex;gap:10px;align-items:flex-start;background:#FFF4F2;color:var(--red2);border-radius:12px;padding:10px 12px;font-weight:600;font-size:13px;margin:10px 0}
.alert.i{background:#FFF4E8;color:#7A4A00}
.alert .ic{width:18px;height:18px;margin-top:1px}
.demo{display:flex;gap:8px;align-items:center;background:#FFF4E8;color:#7A4A00;border-radius:12px;padding:8px 12px;font-size:12px;font-weight:600;margin:8px 16px}
.demo b{color:var(--red2)}
.empty{text-align:center;padding:30px 24px}
.empty .ft{width:120px;height:120px;border-radius:50%;margin:0 auto 14px}
.empty h2{font:800 20px Inter,sans-serif;margin:0}
.empty p{color:var(--mute);margin:6px auto 16px;max-width:280px}
.skel{background:linear-gradient(90deg,#F4ECE4 0%,#FBF7F2 40%,#F4ECE4 80%);background-size:200% 100%;animation:sh 1.3s linear infinite;border-radius:14px}
@keyframes sh{to{background-position:-200% 0}}
.field{margin-top:10px}
.field label{display:block;font-weight:700;font-size:12px;color:#5A463E;margin-bottom:5px}
.field input,.field textarea,.inp{width:100%;border:1.5px solid var(--line2);border-radius:12px;padding:12px;font-size:15px;background:#fff;outline:none}
.field input:focus,.field textarea:focus,.inp:focus{border-color:var(--red)}
.field textarea{resize:vertical;min-height:60px}
.hint{font-size:11.5px;color:var(--mute);margin-top:4px}
.gattr{font-size:11px;color:var(--mute);padding:8px 16px 0;margin:0}
.gattr b{color:#5A463E}
.soonp{font-size:11px;font-weight:700;color:var(--red2)}

/* Connexion */
.login{min-height:100dvh;position:relative;background:var(--red);overflow:hidden}
.login .grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:34px 16px 0;transform:rotate(-6deg) scale(1.12);opacity:.98}
.login .sheetw{background:#fff;border-radius:26px 26px 0 0;position:absolute;left:0;right:0;bottom:0;min-height:58%;padding:22px 18px calc(22px + env(safe-area-inset-bottom))}
.login .brand{display:flex;align-items:center;gap:8px}
.login .brand svg{width:40px;height:40px}
.login .wm{font:800 22px Unbounded,Inter,sans-serif}
.login .wm span{font-weight:500}
.phoneinp{display:flex;gap:8px}
.cc{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line2);border-radius:12px;height:48px;padding:0 10px;font-weight:700;flex:none}
.flag{width:20px;height:14px;border-radius:2px;background:linear-gradient(#EF2B2D 50%,#009E49 50%);position:relative}
.flag i{position:absolute;left:7px;top:4px;width:6px;height:6px;background:#FCD116;clip-path:polygon(50% 0,61% 38%,100% 38%,69% 60%,80% 100%,50% 76%,20% 100%,31% 60%,0 38%,39% 38%)}
.phoneinp input{flex:1;border:1.5px solid var(--red);border-radius:12px;height:48px;padding:0 12px;font-size:16px;font-weight:600;outline:none}
.divi{display:flex;align-items:center;gap:8px;margin:14px 0 8px;color:#9B8A81;font-size:12px}
.divi::before,.divi::after{content:"";flex:1;height:1px;background:#EFE4DA}

/* Restaurant */
.hero{position:relative;height:190px}
.hero .ft{height:190px;border-radius:0}
.hero .acts{position:absolute;top:calc(12px + env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;z-index:3}
.logo-sq{width:58px;height:58px;border-radius:16px;background:var(--ink);color:var(--gold);display:grid;place-items:center;font:800 13px Unbounded,Inter,sans-serif;border:3px solid #fff;position:relative}
.rname{font:800 22px Inter,sans-serif;letter-spacing:-.02em;margin-top:6px}
.kp2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.kp2>div{background:var(--soft);border-radius:12px;padding:9px 10px}
.kp2 b{display:block;font-size:15px}
.tabsw{position:sticky;top:0;z-index:15;background:#fff;padding:10px 0 8px}
.mrow{display:flex;gap:12px;align-items:flex-start;padding:10px 16px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer}
.mrow:disabled{cursor:not-allowed}
.mrow:disabled .grow,.mrow:disabled .ftw{opacity:.5}
.mrow .grow{flex:1}
.mrow .ftw{width:82px;position:relative;flex:none}
.msec{scroll-margin-top:70px}
.msec h3{font:800 17px Inter,sans-serif;margin:14px 16px 2px}
.out{color:var(--red2);font-weight:700;font-size:12px}
.cartbar{position:fixed;z-index:35;left:50%;transform:translateX(-50%);width:min(480px,100%);bottom:calc(16px + env(safe-area-inset-bottom));padding:0 12px}

/* Feuilles du bas */
.sheet-bg{position:fixed;inset:0;z-index:80;background:#2a171280;display:flex;align-items:flex-end;justify-content:center;animation:fin .2s ease}
.sheet-bg.closing{animation:fout .2s ease forwards}
.bsheet{background:#fff;width:min(480px,100%);max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));position:relative;animation:sup .3s cubic-bezier(.2,.8,.2,1);scrollbar-width:thin}
.sheet-bg.closing .bsheet{animation:sdown .2s ease-in forwards}
.bsheet.flush{padding:0}
@keyframes fin{from{opacity:0}}@keyframes fout{to{opacity:0}}@keyframes sup{from{transform:translateY(40px)}}@keyframes sdown{to{transform:translateY(40px)}}
.bsheet h2{font:800 20px Inter,sans-serif;margin:4px 0 4px}
.bsheet .sub{color:var(--mute);margin:0 0 12px}
.platimg .ft{height:230px;border-radius:0}
.platimg{position:relative}
.platimg .x{position:absolute;top:14px;left:16px;z-index:3}
.opt{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt .nm{flex:1;font-weight:600}
.opt .rd{margin-left:10px}
.opt .rd.sq{border-radius:6px}
.opt input:focus-visible~.rd{outline:3px solid var(--gold);outline-offset:2px}
.foot{position:sticky;bottom:0;background:#fff;display:flex;gap:10px;align-items:center;padding:12px 16px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -1px 0 var(--line)}

/* Carte et suivi */
.mapw{position:relative;height:calc(100dvh - var(--nav) - env(safe-area-inset-bottom));overflow:hidden;background:#F3EBDD}
.mapw .map,.mapw .gmap{position:absolute;inset:0;width:100%;height:100%}
.mapw .over{position:absolute;left:0;right:0;top:0;z-index:5;padding:calc(12px + env(safe-area-inset-top)) 16px 0}
.searchpill{display:flex;align-items:center;gap:8px;background:#fff;border-radius:99px;height:44px;padding:0 14px;box-shadow:0 2px 10px #2a171222}
.mpin{position:absolute;z-index:2;display:flex;gap:3px;align-items:center;background:none;border:0;padding:0;cursor:pointer;transform:translate(-15px,-30px)}
.mpin .pi{width:30px;height:30px;border-radius:50% 50% 50% 4px;background:var(--ink);display:grid;place-items:center;color:#fff;transition:transform .2s,background .2s}
.mpin .pi .ic{width:16px;height:16px}
.mpin .pl{background:var(--red);color:#fff;font-weight:700;font-size:11px;padding:2px 6px;border-radius:6px;white-space:nowrap}
.mpin.g .pi{background:#fff;color:var(--ink);box-shadow:0 1px 4px #2a171244}
.mpin.on .pi{background:var(--red);color:#fff;transform:scale(1.15)}
.mpin.gm{position:relative;transform:none}
.me{position:absolute;z-index:2;width:22px;height:22px;transform:translate(-11px,-11px)}
.me .pulse{display:block;width:22px;height:22px;border-radius:50%;background:#E0362A55}
.me i{position:absolute;inset:5px;border-radius:50%;background:var(--red);border:2px solid #fff}
.me.gm{position:relative;transform:none}
.msheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -6px 24px #2a171222;padding:8px 16px 16px;z-index:6}
.mnote{position:absolute;left:10px;z-index:3;font-size:10.5px;font-weight:700;color:#5A463E;background:#ffffffd9;padding:3px 8px;border-radius:7px}
.trackw{position:relative;height:330px;overflow:hidden;background:#F3EBDD}
.trackw .map{position:absolute;inset:0;width:100%;height:100%}
.tsheet{position:relative;margin-top:-24px;background:#fff;border-radius:24px 24px 0 0;padding:8px 16px 16px;z-index:3}
.moto{position:absolute;z-index:2;width:36px;height:36px;border-radius:50%;background:var(--gold);display:grid;place-items:center;border:3px solid #fff;box-shadow:0 2px 8px #2a171244;transform:translate(-18px,-18px)}
.code{background:var(--soft);border-radius:12px;padding:10px;margin-top:12px;font-size:12px}
.code b{font-size:17px;letter-spacing:.14em}

/* Galerie (établissements Google) */
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:190px;scrollbar-width:none}
.gal .ft{flex:0 0 100%;height:190px;border-radius:0;scroll-snap-align:start}
.gal .tag{top:auto;bottom:36px}
.hours{list-style:none;margin:0;padding:0}
.hours li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.hours li:last-child{border-bottom:0}

@supports (backdrop-filter:blur(16px)){
  .nb,.topbar{background:rgba(255,251,247,.88);backdrop-filter:blur(16px) saturate(140%)}
}
@media (prefers-reduced-motion:no-preference){
  .btn,.chip,.home-search,.cat,.circ,.heart,.arr,.q button{transition:transform .16s ease-out}
  .btn:not(:disabled):active,.chip:active,.home-search:active,.cat:active,.circ:active,.heart:active,.arr:active,.q button:not(:disabled):active{transform:scale(.97);transition:none}
}
@media (prefers-reduced-motion:reduce){
  .skel,.toast,.sheet-bg,.bsheet,.sheet-bg.closing,.sheet-bg.closing .bsheet,.pulse{animation:none}
  .sheet-bg.closing{opacity:0}
  .cat .ft,.tg::after,.mpin .pi{transition:none}
}
@media (prefers-reduced-transparency:reduce),(prefers-contrast:more){
  .nb,.topbar{background:#fff;backdrop-filter:none}
  .nb{border-top:1px solid #8a756b}
}
/* Identité visuelle client */
#app,.nb,.tabsw,.bsheet,.foot{background:#FFFDFA}
.topbar{background:#fffdfaee}
.h,.rname,.msec h3,.bigt{font-family:Georgia,serif;font-weight:400;letter-spacing:-.03em}
.h{font-size:21px}.rname{font-size:27px}.msec h3{font-size:21px}
.btn,.chip,.ft,.pm,.field input,.field textarea,.inp{border-radius:14px}
.chip.on{background:var(--ink);color:#fff}
.sec{padding-top:22px}
.home-intro{padding-top:19px}
.home-intro h1{font:400 30px/1.1 Georgia,serif;letter-spacing:-.035em;margin:0 0 7px}
.home-intro h1 em{color:var(--red);font-weight:400}
.home-intro p{margin:0}
.home-search{display:flex;align-items:center;gap:10px;height:46px;margin-top:16px;padding:0 14px;background:var(--chip);border:1px solid var(--line);border-radius:14px;color:var(--mute);font-size:13px}
.addr .m{font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:800}
.addr .t{margin-top:3px}
.addr .t:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);flex:none}
.banner{min-height:145px;background:#A93628;border-radius:20px;padding:18px;isolation:isolate}
.banner:before{content:"";position:absolute;right:-20px;top:-35px;width:180px;height:180px;border:1px solid #ffffff30;border-radius:50%;z-index:-1}
.banner-copy{position:relative;z-index:1;flex:1;max-width:65%}
.banner-label{font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:800;color:#FFDBA8}
.banner .bt{font:400 24px/1.05 Georgia,serif;letter-spacing:-.02em;margin-top:8px}
.banner .bs{font-size:11px;line-height:1.35;color:#FFE5DC;margin:7px 0 10px}
.banner .chip{font-size:11px;padding:7px 11px;background:#F3C765}
.banner .chip .ic{width:13px;height:13px}
.banner-art{position:absolute;right:-14px;bottom:-16px;width:47%;height:130px;transform:rotate(-12deg);filter:drop-shadow(0 7px 8px #50251e66)}
.banner-art svg{width:100%;height:100%}
.cats{gap:8px;padding:0 16px 4px}
.cat{flex-basis:76px;background:#F6F1E9;border-radius:14px;padding:8px 4px;gap:5px}
.cat .ft{width:50px;height:50px;border-radius:12px}
.cat.on{background:#FBE9DF;box-shadow:inset 0 0 0 1px #E8B5A2}
.cat.on .ft{box-shadow:none}
.hs{grid-auto-columns:48%}
.rc .ft{height:120px;border-radius:16px}
.rc .t{margin-top:8px}
.k-riz{background:#E8C99E}.k-bro{background:#E9C0A8}.k-pou{background:#EBD0A2}.k-to{background:#D9DDBC}.k-piz{background:#EAC6B3}.k-bur{background:#E9CEA9}.k-bis{background:#E9CDD2}.k-poi{background:#D2E0DD}
.nb{border-color:var(--line)}
.circ.on{color:var(--red)}.circ.on .ic{fill:currentColor}
.hero,.hero .ft,.gal,.gal .ft{height:210px}
.restaurant-intro{padding-top:18px}
.kp2>div{background:var(--soft)}
.mrow{padding-top:14px;padding-bottom:14px}
.mrow .ftw{width:90px}
.mrow .ftw .ft{border-radius:14px}
@media(max-width:350px){.banner-copy{max-width:70%}.banner .bt{font-size:21px}.hs{grid-auto-columns:58%}}
